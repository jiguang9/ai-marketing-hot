# AI 营销热点数据源配置
# type: api | rss | html (html 为 V2 预留，V1 仅处理 api 和 rss)
# priority: 1=最高, 3=最低
# categories: 该源主要覆盖的营销分类

sources:
  # ─── 第一层：AI 行业源 ───────────────────────────────────────────
  - name: "AI HOT API"
    type: api
    url: "https://aihot.virxact.com/api/public/items"
    enabled: true
    priority: 1
    categories: [platform_changes, tools_launches, seo_aeo]
    notes: "主力 AI 行业动态源，由 fetch_aihot.py 单独处理，不走本文件"

  # ─── 第二层：营销平台官方源 ──────────────────────────────────────
  - name: "Google Ads Blog"
    type: rss
    url: "https://blog.google/products/ads/rss/"
    enabled: true
    priority: 1
    categories: [platform_changes, paid_ads, seo_aeo]

  - name: "Google Search Central Blog"
    type: rss
    url: "https://developers.google.com/search/blog/rss.xml"
    enabled: true
    priority: 1
    categories: [seo_aeo, platform_changes]

  - name: "Meta for Business"
    type: rss
    url: "https://www.facebook.com/business/news/rss/"
    enabled: false
    priority: 1
    categories: [platform_changes, paid_ads, social_growth]
    notes: "Meta 官方无稳定 RSS，V1 暂禁用，V2 改用 HTML 抓取"

  - name: "TikTok Business Blog"
