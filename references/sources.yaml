# AI 营销热点数据源配置
# type: api | rss | html (html 为 V2 预留，V1 仅处理 api 和 rss)
# priority: 1=最高, 3=最低
# categories: 该源主要覆盖的营销分类
# enabled: 仅设为 true 的 rss 源会被 fetch_sources.py 拉取
#
# 可用性验证日期：2026-05-22
# 测试方法：带浏览器 UA 的 HTTP HEAD/GET，检查是否返回有效 XML

sources:
  # ─── 第一层：AI 行业源 ───────────────────────────────────────────
  - name: "AI HOT API"
    type: api
    url: "https://aihot.virxact.com/api/public/items"
    enabled: true
    priority: 1
    categories: [platform_changes, tools_launches, seo_aeo]
    notes: "主力 AI 行业动态源，由 fetch_aihot.py 单独处理，不走本文件"

  # ─── 第二层：营销平台官方源 ──────────────────────────────────────
  - name: "Google Blog (The Keyword)"
    type: rss
    url: "https://blog.google/rss/"
    enabled: true
    priority: 1
    categories: [platform_changes, paid_ads, seo_aeo]
    notes: "Google 全产品官方博客，覆盖 Ads / Search / AI 动态。原 /products/ads/rss/ 已 404"

